# Практика 5, продолжение. Service типа ExternalName.
# Применение:  kubectl apply -f manifests/05_services/service-externalname.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Приложение в кластере подключается к базе данных по имени. Пока база
# тоже в кластере — это имя Service. Но однажды базу переведут наружу,
# в облако или на отдельный сервер. Тогда придётся лезть в конфигурацию
# приложения и менять адрес, а это пересборка, выкат, риск ошибки.
#
# ExternalName решает это без изменений в приложении: мы создаём Service,
# который ничего не балансирует и не имеет ни ClusterIP, ни подов, а просто
# возвращает DNS-запись CNAME на внешнее имя.
#
# Приложение продолжает ходить на то же имя, и ничего не замечает.
# Это удобный способ вынести часть инфраструктуры за пределы кластера,
# не трогая код.
#
# КАК ПРОВЕРИТЬ, ЧТО РАБОТАЕТ:
#     kubectl run dns-test --rm -it --restart=Never --image=busybox:1.36 -- nslookup external-db
#
# В выводе будет CNAME на db.example.com — то есть имя резолвится,
# хотя никаких подов за этим Service нет.
#
# ВАЖНЫЕ ОГРАНИЧЕНИЯ, О КОТОРЫХ СТОИТ ЗНАТЬ:
#   * работает только на уровне DNS. Если приложение ходит по IP-адресу
#     или само разрешает имя в обход системного резолвера, ExternalName
#     не поможет;
#   * clusterIP у такого Service отсутствует, обращаться по нему нельзя;
#   * доступность внешнего сервиса Kubernetes не проверяет: если база
#     недоступна, Service всё равно будет «работать», а ошибку получит
#     приложение.
apiVersion: v1
kind: Service
metadata:
  name: external-db
spec:
  type: ExternalName
  externalName: db.example.com
