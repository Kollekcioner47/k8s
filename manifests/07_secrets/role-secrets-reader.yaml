# Практика 7, продолжение. RBAC на секреты: ограничиваем доступ.
# Применение:  kubectl apply -f manifests/07_secrets/role-secrets-reader.yaml
#
# ЗАЧЕМ ЭТО НУЖНО — и это главное, что надо понять про секреты в Kubernetes
#
# Base64 — это не шифрование, а кодирование. Любой, у кого есть право
# читать объекты типа Secret, получит содержимое одной командой:
#
#     kubectl get secret mysecret -o jsonpath='{.data.password}' | base64 --decode
#
# То есть реальная защита секретов в Kubernetes — это НЕ base64, а две вещи:
#   1. RBAC: кто вообще может читать секреты;
#   2. шифрование etcd: что лежит на дисках управляющих нод.
#
# Здесь мы делаем первую половину: даём приложению право читать ТОЛЬКО
# свои секреты, а не все подряд.
#
# ПОЧЕМУ ЭТО ВАЖНО НА ПРАКТИКЕ: по умолчанию ServiceAccount не имеет прав
# на секреты вообще. Но как только вы выдали праву «читать секреты» одной
# роли для одного приложения, легко случайно выдать её слишком широко —
# и тогда любая уязвимость в этом приложении отдаст злоумышленнику
# ВСЕ секреты namespace, включая чужие токены и пароли к базам.
---
# Роль разрешает читать только секреты с конкретной меткой.
# Селектор по меткам в RBAC нельзя задать напрямую, поэтому приём такой:
# разрешаем читать секреты по имени, перечислив их явно.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader
  namespace: default
rules:
  # resourceNames ограничивает действие роли конкретными объектами.
  # Без него роль давала бы доступ ко ВСЕМ секретам namespace — и это
  # та самая ошибка, о которой сказано выше.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mysecret", "mysecret-immutable"]
    verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: my-app-sa
    namespace: default
roleRef:
  kind: Role
  name: app-secrets-reader
  apiGroup: rbac.authorization.k8s.io
