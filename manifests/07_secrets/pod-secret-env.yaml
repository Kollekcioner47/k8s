# Практика 7. Secret как переменные окружения.
# Применение:  kubectl apply -f manifests/07_secrets/pod-secret-env.yaml
#
# Внутри контейнера:  echo $SECRET_USERNAME  ->  admin
#
# ВАЖНО: переменные окружения из Secret не обновляются при изменении Secret —
# контейнер нужно пересоздать. Смонтированный том обновляется сам (примерно
# через минуту), поэтому для ротации секретов том предпочтительнее.
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
spec:
  containers:
    - name: mycontainer
      image: redis
      env:
        - name: SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: username
        - name: SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: password
  restartPolicy: Never
