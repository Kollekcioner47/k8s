# Практика 7, продолжение. Secret для приватного реестра образов.
# Применение: см. комментарий ниже — манифестом это делать НЕ рекомендуется.
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Пока образы публичные, кластер скачивает их без вопросов. Но в реальной
# работе образы почти всегда лежат в приватном реестре: Docker Hub с приватным
# репозиторием, GitLab Registry, Harbor, Nexus. При попытке скачать такой
# образ под уходит в ImagePullBackOff, а в событиях появляется:
#
#     Failed to pull image: ... unauthorized: authentication required
#     или 401 Unauthorized / pull access denied
#
# Лечится это секретом специального типа kubernetes.io/dockerconfigjson.
#
# КАК ПРАВИЛЬНО СОЗДАВАТЬ — КОМАНДОЙ, А НЕ МАНИФЕСТОМ
#
# Формат этого секрета — JSON внутри base64, и собирать его руками очень
# легко ошибиться: одна пропущенная скобка или лишний перенос строки,
# и секрет бесполезен без внятного сообщения об ошибке. Поэтому используйте
# готовую команду:
#
#     kubectl create secret docker-registry my-registry-secret \
#       --docker-server=https://index.docker.io/v1/ \
#       --docker-username=YOUR_DOCKERHUB_LOGIN \
#       --docker-password=YOUR_DOCKERHUB_PASSWORD \
#       --docker-email=your@email.com
#
# Для Docker Hub поле --docker-server можно опустить, но лучше указывать
# явно: у Docker Hub за историю было несколько адресов реестра, и «правильный»
# из них — именно https://index.docker.io/v1/.
#
# Для других реестров адрес другой:
#     GitLab:  registry.gitlab.com
#     Harbor:  harbor.example.com
#     GHCR:    ghcr.io
#
# МАНИФЕСТ НИЖЕ — ДЛЯ ПОНИМАНИЯ УСТРОЙСТВА, применять его не нужно.
# Значение .dockerconfigjson — это base64 от такого JSON:
#
#     {"auths":{"https://index.docker.io/v1/":{
#        "username":"YOUR_DOCKERHUB_LOGIN",
#        "password":"YOUR_DOCKERHUB_PASSWORD",
#        "auth":"<base64 от строки логин:пароль>"}}}
#
# ВНИМАНИЕ: в приведённом ниже примере стоят заглушки вместо реальных
# логина и пароля. Скопировав его как есть, вы получите неработающий секрет.
apiVersion: v1
kind: Secret
metadata:
  name: my-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJZT1VSX0RPQ0tFUkhVQl9MT0dJTiIsInBhc3N3b3JkIjoiWU9VUl9ET0NLRVJIVUJfUEFTU1dPUkQiLCJhdXRoIjoiV1U5VlVsOUVUME5MUlZKSVZVSmZURTlIU1U0NldVOVZVbDlFVDBOTFJWSklWVUpmVUVGVFUxZFBVa1E9In19fQ==
