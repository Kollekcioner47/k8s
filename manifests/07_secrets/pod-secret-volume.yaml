# Практика 7. Secret, смонтированный как том.
# Применение:  kubectl apply -f manifests/07_secrets/pod-secret-volume.yaml
#
# Внутри контейнера появятся два файла: /etc/foo/username и /etc/foo/password.
# Если указать items, можно переименовать ключи и смонтировать их по своим
# путям — тогда остальные ключи в том не попадут.
apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
    - name: mypod
      image: redis
      volumeMounts:
        - name: foo
          mountPath: "/etc/foo"
          readOnly: true
  volumes:
    - name: foo
      secret:
        secretName: mysecret
        items:
          - key: username
            path: my-group/my-username
