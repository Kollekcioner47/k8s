# Практика 7, продолжение. Под, использующий секрет реестра.
# Применение:  kubectl apply -f manifests/07_secrets/pod-image-pull-secret.yaml
#
# Сначала создайте секрет реестра командой (см. комментарий в
# secret-docker-registry.yaml):
#
#     kubectl create secret docker-registry my-registry-secret \
#       --docker-server=https://index.docker.io/v1/ \
#       --docker-username=ВАШ_ЛОГИН \
#       --docker-password=ВАШ_ПАРОЛЬ
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Пока образы публичные, imagePullSecrets не требуется. Но как только
# образ лежит в приватном репозитории, без этого поля под не запустится:
# kubelet не сможет скачать образ и уйдёт в ImagePullBackOff.
#
# ДВА СПОСОБА ПОДКЛЮЧИТЬ СЕКРЕТ РЕЕСТРА — и второй обычно удобнее.
#
# Способ 1 (показан здесь): указать imagePullSecrets прямо в поде.
#   Плюс: явно и локально, видно, что от чего зависит.
#   Минус: надо не забыть добавить в КАЖДЫЙ под и каждый Deployment.
#
# Способ 2: привязать секрет к ServiceAccount, который используют поды.
#   Тогда он подхватывается автоматически для всех подов этого аккаунта.
#   Это стандартная практика в продакшене — см. serviceaccount-pull-secret.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: private-image-pod
  labels:
    app: private-demo
spec:
  # Здесь перечисляются секреты, которыми kubelet пользуется при скачивании
  # образов. В списке может быть несколько — например, если приложение
  # и sidecar лежат в разных приватных реестрах.
  imagePullSecrets:
    - name: my-registry-secret

  containers:
    - name: app
      # Замените на образ из вашего приватного репозитория.
      # Публичный образ здесь тоже сработает, но тогда секрет не проверить:
      # он просто не понадобится.
      image: YOUR_DOCKERHUB_LOGIN/k8sphp:version1
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
