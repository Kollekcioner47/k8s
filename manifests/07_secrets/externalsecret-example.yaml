# Практика 7, продолжение. Внешнее хранилище секретов: External Secrets.
# Применение:  kubectl apply -f manifests/07_secrets/externalsecret-example.yaml
#
# ТРЕБУЕТСЯ: установленный External Secrets Operator (см. команду ниже)
# и настроенное подключение к хранилищу (SecretStore или ClusterSecretStore).
#
# ЗАЧЕМ ЭТО НУЖНО — и почему секретов в git быть не должно
#
# У хранения секретов прямо в Kubernetes есть слабое место: значение
# всё равно надо откуда-то взять. Если вы держите манифест секрета в git —
# секрет в git. Если вписываете руками — он живёт в истории команд,
# в чьей-то голове и в переписке.
#
# Промышленный подход другой: секреты живут в специализированном хранилище
# (HashiCorp Vault, AWS Secrets Manager, Yandex Lockbox, GCP Secret Manager),
# а в Kubernetes попадают автоматически. В git при этом лежит только
# ССЫЛКА на секрет, без самого значения.
#
# External Secrets Operator как раз этим и занимается: он читает значение
# из внешнего хранилища и создаёт обычный Secret в кластере. Приложение
# работает как обычно и не знает, откуда взялся секрет.
#
# Установка оператора:
#     helm repo add external-secrets https://charts.external-secrets.io
#     helm install external-secrets external-secrets/external-secrets \
#       -n external-secrets --create-namespace
#
# ЗАТЕМ нужно описать подключение к хранилищу — объект SecretStore
# (для одного namespace) или ClusterSecretStore (для всего кластера).
# В нём указывается адрес Vault и способ аутентификации. В примере ниже
# предполагается, что SecretStore с именем vault-backend уже создан.
#
# ВАЖНОЕ ПРЕИМУЩЕСТВО, КРОМЕ БЕЗОПАСНОСТИ: централизованная ротация.
# Поменяли пароль в Vault — оператор обновит Secret в кластере. Правда,
# помните из основной практики: поды, читающие секрет через переменные
# окружения, всё равно потребуют перезапуска. Тома обновляются сами.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: default
spec:
  # Как часто проверять изменения во внешнем хранилище.
  refreshInterval: 1h

  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    # Имя Secret, который будет создан в кластере. Именно на него
    # ссылаются поды — для них это обычный секрет Kubernetes.
    name: db-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        # Путь и ключ внутри Vault.
        key: secret/data/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/database
        property: password
