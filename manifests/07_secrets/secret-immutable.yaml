# Практика 7, продолжение. Неизменяемый Secret (immutable).
# Применение:  kubectl apply -f manifests/07_secrets/secret-immutable.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Неизменяемый секрет нельзя изменить после создания — ни через apply,
# ни через edit. Казалось бы, зачем себя ограничивать?
#
# Причины вполне практические:
#
#   1. ЗАЩИТА ОТ СЛУЧАЙНОСТИ. Секрет, который используется десятком
#      приложений, невозможно случайно испортить одной командой.
#      Изменить значение можно только осознанно: удалить и создать заново.
#
#   2. ПРОИЗВОДИТЕЛЬНОСТЬ. kubelet не опрашивает API-сервер на предмет
#      изменений таких секретов. На больших кластерах с тысячами секретов
#      и подов это заметная экономия. Именно ради этого механизм и вводили.
#
#   3. ПРЕДСКАЗУЕМОСТЬ. Вы точно знаете, что значение не поменялось
#      «где-то по пути», пока поды работают.
#
# ОГРАНИЧЕНИЕ, которое надо помнить: снять флаг immutable С ТЕКУЩЕГО СЕКРЕТА
# невозможно. Попытка изменить вызовет ошибку «field is immutable».
# Единственный путь — удалить секрет и создать заново с нужным значением.
# Планируйте это: удаление секрета на время лишит приложения их данных,
# пока не будет создан новый.
apiVersion: v1
kind: Secret
metadata:
  name: mysecret-immutable
type: Opaque
immutable: true
data:
  username: YWRtaW4=
  password: Qjd3SXRZbEhlUlIx
