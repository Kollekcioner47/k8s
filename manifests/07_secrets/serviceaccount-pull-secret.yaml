# Практика 7, продолжение. Секрет реестра на уровне ServiceAccount.
# Применение:  kubectl apply -f manifests/07_secrets/serviceaccount-pull-secret.yaml
#
# Сначала создайте сам секрет реестра:
#     kubectl create secret docker-registry my-registry-secret \
#       --docker-server=https://index.docker.io/v1/ \
#       --docker-username=ВАШ_ЛОГИН \
#       --docker-password=ВАШ_ПАРОЛЬ
#
# ЗАЧЕМ ЭТОТ СПОСОБ ЛУЧШЕ, ЧЕМ УКАЗЫВАТЬ imagePullSecrets В КАЖДОМ ПОДЕ
#
# Если секрет прописан в ServiceAccount, то ЛЮБОЙ под, использующий этот
# аккаунт, получает доступ к приватному реестру автоматически. Не нужно
# помнить про imagePullSecrets в каждом Deployment, в каждом Job,
# в каждом CronJob.
#
# Именно так делают в реальных кластерах: создают отдельный ServiceAccount
# для приложений и привязывают к нему секрет реестра. А для системных
# компонентов — свой.
#
# ВАЖНО ПОНИМАТЬ РАЗНИЦУ ДВУХ ПОЛЕЙ:
#
#   imagePullSecrets — ЧЕМ АУТЕНТИФИЦИРОВАТЬСЯ при скачивании образов.
#     Это то, что описывает данный манифест.
#
#   automountServiceAccountToken — МОНТИРОВАТЬ ЛИ ТОКЕН АККАУНТА в поды,
#     чтобы приложение могло обращаться к API кластера. К скачиванию
#     образов отношения не имеет. Если приложению API не нужно, токен
#     лучше не монтировать — меньше поверхность атаки.
#
# Эти два поля часто путают, хотя решают совершенно разные задачи.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
imagePullSecrets:
  - name: my-registry-secret

# Токен аккаунта в поды не монтируем: приложению он здесь не нужен.
# Если понадобится обращаться к API кластера, поставьте true.
automountServiceAccountToken: false
