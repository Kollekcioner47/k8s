# Практика 7. Secret, описанный вручную.
# Применение:  kubectl apply -f manifests/07_secrets/secret.yaml
#
# Значения в поле data — это base64, то есть КОДИРОВКА, а не шифрование.
# Любой может их раскодировать:  echo 'YWRtaW4=' | base64 --decode
#
# Получить base64 из строки:
#   echo -n 'admin' | base64          -> YWRtaW4=
#   echo -n 'B7wItYlHeRR1' | base64   -> Qjd3SXRZbEhlUlIx
# Флаг -n обязателен, иначе в значение попадёт перевод строки.
apiVersion: v1
kind: Secret
metadata:
  name: mysecret
type: Opaque
data:
  username: YWRtaW4=
  password: Qjd3SXRZbEhlUlIx
