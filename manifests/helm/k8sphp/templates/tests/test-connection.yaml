{{/*
Тест чарта. Запускается командой:  helm test ИМЯ_РЕЛИЗА

ЗАЧЕМ ЭТО НУЖНО
Helm по умолчанию считает релиз успешным, если объекты создались и поды
стали готовыми. Но «под запустился» и «приложение отвечает» — разные вещи.
helm test позволяет проверить работоспособность по-настоящему: он запускает
указанные здесь поды и считает релиз прошедшим тест, только если они
завершились успешно.

ВАЖНАЯ ДЕТАЛЬ: аннотация "helm.sh/hook": test. Именно она говорит Helm,
что этот объект — тест, а не часть обычного релиза. Такой под НЕ создаётся
при helm install и живёт только на время проверки.

Типичные проверки в тестах: приложение отвечает на HTTP, порт открыт,
база данных доступна, миграции применились.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8sphp.fullname" . }}-test-connection"
  labels:
    {{- include "k8sphp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "k8sphp.fullname" . }}:{{ .Values.service.port }}"
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
