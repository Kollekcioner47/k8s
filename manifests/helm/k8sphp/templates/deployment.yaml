{{/*
Шаблон Deployment.

Обратите внимание, что пояснения оформлены как комментарии Helm, а не как
обычные комментарии YAML (#). Разница практическая: обычные комментарии
попадают в отрендеренный манифест и остаются в объекте в кластере,
а комментарии Helm в вывод не попадают. Чем больше чарт, тем заметнее
эта разница.

Про критичное место: spec.selector.matchLabels и метки шаблона пода должны
совпадать. Здесь оба берутся из одного определения selectorLabels, поэтому
разойтись они не могут в принципе. Это и есть главная польза helpers —
вместо «не забудь синхронизировать два блока» появляется одно место.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sphp.fullname" . }}
  labels:
    {{- include "k8sphp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8sphp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8sphp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.container.image }}"
          imagePullPolicy: {{ .Values.container.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
