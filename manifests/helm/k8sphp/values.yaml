# Значения по умолчанию для чарта k8sphp.
#
# ГЛАВНОЕ ПРАВИЛО: ключи здесь должны совпадать с тем, что написано
# в шаблонах templates/*.yaml. Если в шаблоне указать .Values.containers.image
# (во множественном числе), а здесь описать container.image — Helm подставит
# пустую строку, и под упадёт с ошибкой «image: Required value». Опечатка
# при этом совершенно не видна при чтении глазами.
#
# От этой ошибки защищает values.schema.json в этом же каталоге: Helm
# проверяет значения по схеме до рендеринга и сообщает о несоответствии.

# Переопределение имени чарта и полного имени релиза.
# Пустые значения означают «использовать значения по умолчанию».
nameOverride: ""
fullnameOverride: ""

# Сколько реплик развернуть.
replicaCount: 2

container:
  # ВАЖНО: замените на свой логин на Docker Hub, иначе поды уйдут
  # в ImagePullBackOff (см. практику 2).
  image: YOUR_DOCKERHUB_LOGIN/k8sphp:version1

  # IfNotPresent — не скачивать образ, если он уже есть на ноде.
  # Для тегов вроде version1 это правильно. Для latest — нет: тогда
  # изменения не подхватятся без ручного удаления образа с ноды.
  pullPolicy: IfNotPresent

  # Порт, который слушает контейнер.
  port: 80

service:
  # ClusterIP, NodePort или LoadBalancer.
  type: ClusterIP
  port: 80

  # Используется только при type: NodePort. Если оставить пустым,
  # Kubernetes выберет порт случайно из диапазона 30000-32767.
  nodePort: ""

# Заготовка на будущее: включение Ingress. Пока шаблона Ingress нет,
# значение просто хранится и упоминается в NOTES.txt.
ingressEnabled: false

# Секреты для скачивания образов из приватного реестра (практика 7).
# Пустой список означает «образы публичные».
imagePullSecrets: []

# Ресурсы. Заданы осознанно: без них под относится к классу BestEffort
# и будет вытеснен первым при нехватке памяти на ноде.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
