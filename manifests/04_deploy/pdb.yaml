# Практика 4, продолжение. PodDisruptionBudget: защита от «добровольных»
# вытеснений.
# Применение:  kubectl apply -f manifests/04_deploy/pdb.yaml
# (сначала должен существовать Deployment my-web-rolling)
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Есть два вида вытеснения подов с ноды, и их важно различать:
#
#   НЕДОБРОВОЛЬНОЕ (involuntary) — нода упала, закончилась память, ядро
#     убило процесс. Повлиять на это нельзя, PDB здесь не поможет.
#
#   ДОБРОВОЛЬНОЕ (voluntary) — нода выводится на обслуживание
#     (kubectl drain), идёт обновление кластера (kubeadm upgrade), узел
#     удаляется из автоскейлером. Здесь Kubernetes СПРАШИВАЕТ разрешения,
#     и именно тут работает PodDisruptionBudget.
#
# Без PDB команда kubectl drain спокойно выселит с ноды ВСЕ поды сразу.
# Если это была единственная нода с вашим приложением — будет простой.
# PDB говорит: «одновременно можно останавливать не больше N экземпляров».
#
# ВАЖНО: PDB не влияет на RollingUpdate! Он защищает только от добровольных
# нарушений, а не от действий самого Deployment. Это частое заблуждение.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: my-web-pdb
spec:
  # minAvailable считает от ЖЕЛАЕМОГО числа реплик: при replicas: 4
  # и minAvailable: 3 одновременно можно вывести из строя 1 под.
  #
  # Альтернатива — maxUnavailable: 1. Разница в поведении при масштабировании:
  # minAvailable при уменьшении replicas может заблокировать drain целиком,
  # maxUnavailable ведёт себя предсказуемее. Для большинства случаев
  # рекомендуется maxUnavailable.
  minAvailable: 3

  selector:
    matchLabels:
      app: my-web
      track: stable
