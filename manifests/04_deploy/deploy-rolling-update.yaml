# Практика 4, продолжение. Стратегия RollingUpdate: обновление без простоя.
# Применение:  kubectl apply -f manifests/04_deploy/deploy-rolling-update.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Задача: обновить приложение так, чтобы пользователи ничего не заметили.
# Deployment решает её так: поднимает новые поды рядом со старыми, ждёт,
# пока они станут ГОТОВЫ, и только потом убирает старые.
#
# Два параметра задают, насколько агрессивно это происходит:
#
#   maxSurge — на сколько подов МОЖНО превысить желаемое количество
#     во время обновления. maxSurge: 1 при replicas: 4 означает, что
#     на пике будет 5 подов.
#
#   maxUnavailable — сколько подов МОЖНО убрать, пока новые не готовы.
#     Значение 0 — самое безопасное: ни один старый под не будет удалён,
#     пока новый не станет готовым.
#
# Комбинация maxSurge: 1 / maxUnavailable: 0 даёт обновление вообще без
# потери ёмкости: в любой момент доступны минимум 4 пода. Именно так
# и стоит делать в продакшене. Плата — обновление идёт медленнее и требует
# свободных ресурсов на нодах (нужно место для пятого пода).
#
# ВАЖНОЕ УСЛОВИЕ, БЕЗ КОТОРОГО ВСЁ ЭТО НЕ РАБОТАЕТ
#
# Deployment считает новый под готовым по его readinessProbe. Если пробы
# нет вообще, Kubernetes считает готовым под сразу после запуска процесса —
# то есть трафик пойдёт на приложение, которое ещё не поднялось. Внешне
# обновление «пройдёт успешно», а пользователи поймают ошибки.
#
# Отсюда правило: у любого приложения в Deployment должна быть
# readinessProbe. Без неё стратегия обновления без простоя — фикция.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-rolling
  labels:
    app: my-web
spec:
  replicas: 4

  # Сколько старых ReplicaSet хранить для откатов. 0 означает «не хранить
  # вообще», и тогда kubectl rollout undo станет невозможен.
  revisionHistoryLimit: 5

  # Под считается доступным, только если пробы проходят столько секунд
  # подряд. Защищает от ситуации «проба прошла один раз и сразу упала».
  minReadySeconds: 5

  # Если обновление не продвинулось за это время — Deployment помечается
  # как неудачное (ProgressDeadlineExceeded), и это видно в rollout status.
  # Иначе зависшее обновление можно не заметить часами.
  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: my-web
      track: stable

  template:
    metadata:
      labels:
        app: my-web
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

          # Та самая проба, от которой зависит корректность обновления.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2

          # Без requests под не будет учитываться планировщиком, а HPA
          # не сможет считать процент загрузки.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
