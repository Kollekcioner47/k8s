# Практика 6, продолжение. StorageClass и динамическое создание томов.
# Применение:  kubectl apply -f manifests/06_volumes/storageclass-standard.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# В базовой части практики мы создавали PV руками: описали том на NFS,
# описали локальный том. Это работает, но плохо масштабируется. Представьте
# сто заявок от разработчиков — сто раз надо сходить и создать том вручную.
# А если заявка появилась в три часа ночи, ждать до утра?
#
# StorageClass решает это: он описывает, КАК создавать тома автоматически.
# Разработчик создаёт только PVC, а том появляется сам.
#
# Разница в одной строке манифеста PVC:
#   storageClassName: ""              -> ищем готовый PV, созданный руками
#   storageClassName: local-path      -> создай новый том по этому классу
#
# ОТКУДА ВЗЯТЬ ПРОВИЖНЕР В УЧЕБНОМ КЛАСТЕРЕ
#
# В кластере, собранном по инструкции из модуля 1 (kubeadm), динамического
# провижнера нет вообще: ни облака, ни Ceph, ни NFS-провижнера. Поэтому
# ставим local-path-provisioner — он создаёт тома прямо на дисках нод
# и подходит для любого кластера.
#
#     kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
#     kubectl get pods -n local-path-storage
#
# После установки провижнер создаёт StorageClass с именем local-path и
# помечает его классом по умолчанию. Именно поэтому в нашем классе ниже
# мы НЕ ставим аннотацию «по умолчанию»: два класса по умолчанию в кластере
# приводят к предупреждениям и путанице. Если хотите сделать по умолчанию
# именно свой класс, сначала снимите аннотацию с local-path.
#
# ВАЖНО ПОНИМАТЬ ПРО local-path: это учебное решение. Данные ложатся
# на диск конкретной ноды, и если нода умрёт, данные пропадут вместе с ней.
# Для продакшена нужен настоящий провижнер: облачный диск, Ceph, Longhorn,
# NetApp и подобные.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard

  # Раскомментируйте, чтобы сделать этот класс используемым по умолчанию
  # (PVC без storageClassName возьмут его). Один default на кластер!
  # annotations:
  #   storageclass.kubernetes.io/is-default-class: "true"

# Кто именно будет создавать тома. Для local-path-provisioner это
# rancher.io/local-path. В облаке здесь было бы, например,
# kubernetes.io/aws-ebs или disk.csi.azure.com.
provisioner: rancher.io/local-path

# Что делать с томом после удаления PVC:
#   Delete — удалить том (типично для динамических томов);
#   Retain — оставить и перевести в Released (для важных данных).
# ВНИМАНИЕ: Delete здесь означает, что удаление PVC УНИЧТОЖИТ данные.
# Для баз данных политику меняют на Retain осознанно.
reclaimPolicy: Delete

# WaitForFirstConsumer — не создавать том, пока не появился под, который
# его просит. Для локальных дисков это обязательно: заранее неизвестно,
# на какой ноде окажется под, а диск привязан к ноде.
# Immediate означает «создать сразу» — подходит для сетевых хранилищ.
volumeBindingMode: WaitForFirstConsumer

# Разрешить увеличивать размер существующих томов.
# ВНИМАНИЕ: поддержку обеспечивает провижнер, а не сам флаг. Если провижнер
# расширять тома не умеет, PVC после увеличения запроса зависнет в состоянии
# Resizing или FileSystemResizePending. Проверить — на практике ниже.
allowVolumeExpansion: true
