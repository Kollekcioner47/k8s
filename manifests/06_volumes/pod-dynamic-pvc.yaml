# Практика 6, продолжение. Под, использующий динамически созданный том.
# Применение:  kubectl apply -f manifests/06_volumes/pod-dynamic-pvc.yaml
#
# Требуется PVC dynamic-claim — примените сначала
# manifests/06_volumes/pvc-dynamic.yaml.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ПОД ДЛЯ ДИНАМИЧЕСКОГО ТОМА
#
# При volumeBindingMode: WaitForFirstConsumer том не создаётся, пока нет
# пода. Это сделано специально: провижнер ждёт, на какую ноду планировщик
# поставит под, чтобы создать диск именно там. Поэтому PVC будет висеть
# в Pending, пока не появится этот под, — и это НОРМАЛЬНОЕ поведение,
# а не ошибка. Разбирается в разделе про отладку Pending.
apiVersion: v1
kind: Pod
metadata:
  name: pod-dynamic
  labels:
    app: dynamic-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-claim
