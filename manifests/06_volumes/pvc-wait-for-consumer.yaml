# Практика 6, продолжение. PVC, который «висит» в Pending — и это нормально.
# Применение:  kubectl apply -f manifests/06_volumes/pvc-wait-for-consumer.yaml
#
# ЗАЧЕМ ЭТОТ ФАЙЛ
#
# Pending у PVC — самая частая жалоба при работе с хранилищами, и в половине
# случаев это вообще не проблема. Здесь мы специально воспроизводим
# «нормальный Pending», чтобы вы научились отличать его от настоящей поломки.
#
# Требуется StorageClass standard (volumeBindingMode: WaitForFirstConsumer) —
# примените сначала manifests/06_volumes/storageclass-standard.yaml.
#
# ЧТО ПРОИЗОЙДЁТ
#
#     kubectl apply -f manifests/06_volumes/pvc-wait-for-consumer.yaml
#     kubectl get pvc waiting-claim
#
# Статус будет Pending, а в событиях — прямым текстом:
#
#     kubectl describe pvc waiting-claim
#     ...
#     Events:
#       Normal  WaitForFirstConsumer  waiting for first consumer
#                                     to be created before binding
#
# Прочитайте это буквально: «жду первого потребителя». Провижнер НЕ ХОЧЕТ
# создавать том заранее, потому что ещё не знает, на какой ноде окажется
# под. Если создать диск сейчас, а под поедет на другую ноду — диск будет
# бесполезен.
#
# КАК УБЕДИТЬСЯ, ЧТО ЭТО НЕ ПОЛОМКА: создайте любой под, который использует
# этот PVC, и том появится сам.
#
#     kubectl run consumer --image=busybox:1.36 --restart=Never \
#       --overrides='{"spec":{"containers":[{"name":"c","image":"busybox:1.36","command":["sleep","3600"],"volumeMounts":[{"name":"d","mountPath":"/data"}]}],"volumes":[{"name":"d","persistentVolumeClaim":{"claimName":"waiting-claim"}}]}}'
#
#     kubectl get pvc waiting-claim     # теперь Bound
#     kubectl get pv                    # появился новый PV
#
# ГЛАВНЫЙ ВЫВОД, КОТОРЫЙ СТОИТ ЗАПОМНИТЬ: прежде чем паниковать из-за
# Pending, посмотрите события. Если там WaitForFirstConsumer — всё в порядке,
# просто ждём под. Если «no persistent volumes available» — вот это уже
# настоящая проблема, разбирается в разделе про отладку.
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: waiting-claim
spec:
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
