# Практика 3, продолжение. Init-контейнеры.
# Применение:  kubectl apply -f manifests/03_pods/pod_init_container.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Init-контейнер — это контейнер, который выполняется ДО основных и должен
# успешно завершиться. Основные контейнеры не запустятся, пока все
# init-контейнеры не отработают по очереди. Если init-контейнер упал,
# под будет перезапускать его, пока не добьётся успеха (при restartPolicy
# Always или OnFailure).
#
# Для чего это применяют на практике:
#   * дождаться, пока поднимется база данных или другой сервис;
#   * подготовить файлы или права на общем томе;
#   * склонировать репозиторий или скачать конфигурацию;
#   * выполнить миграции схемы БД до старта приложения.
#
# ЧЕМ ОТЛИЧАЕТСЯ ОТ ОБЫЧНОГО КОНТЕЙНЕРА В ТОМ ЖЕ ПОДЕ
#
# Init-контейнеры идут строго по очереди и завершаются — они не работают
# постоянно рядом с приложением. Для постоянно работающих помощников
# (прокси, сборщик логов) используют обычные контейнеры в одном поде.
#
# У init-контейнеров нет проб: readiness и liveness к ним не применяются,
# они обязаны просто завершиться с кодом 0.
apiVersion: v1
kind: Pod
metadata:
  name: my-web-init
  labels:
    app: my-web
spec:
  # Сначала готовим содержимое для веб-сервера.
  initContainers:
    - name: prepare-content
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo '<h1>Content created by init container</h1>' > /workdir/index.html
          echo "init finished at $(date)" >> /workdir/index.html
          ls -l /workdir
      volumeMounts:
        - name: workdir
          mountPath: /workdir
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # Только после успеха init-контейнера стартует основной.
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  # emptyDir — временный том, который живёт столько же, сколько под.
  # Он общий для init-контейнера и основного контейнера: именно через него
  # они и передают данные.
  volumes:
    - name: workdir
      emptyDir: {}
