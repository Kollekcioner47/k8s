# Практика 3, продолжение. ConfigMap: настройки отдельно от образа.
# Применение:  kubectl apply -f manifests/03_pods/configmap_app-config.yaml
#
# ЗАЧЕМ ЭТО НУЖНО
#
# Настройки приложения не должны быть запечены в образ. Иначе, чтобы
# поменять адрес базы данных, придётся пересобирать и перепубликовывать
# образ — а это долго и опасно. ConfigMap позволяет держать настройки
# отдельно: один и тот же образ работает и на тесте, и в проде.
#
# ConfigMap не подходит для секретов: его содержимое хранится открытым
# текстом и видно любому, у кого есть доступ к API. Пароли — только
# в Secret (практика 7).
#
# В data можно хранить и короткие значения (строка «ключ: значение»),
# и целые файлы (многострочное значение после символа |).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Простые пары ключ-значение — удобно отдавать в переменные окружения.
  APP_ENV: prod
  APP_DEBUG: "false"
  APP_LOG_LEVEL: info

  # Многострочное значение — станет отдельным файлом на диске.
  # Обратите внимание: вертикальная черта после двоеточия сохраняет
  # переводы строк, а отступы внутри значения срезаются по общему уровню.
  app.properties: |
    db.host=postgres
    db.port=5432
    db.name=appdb
    cache.ttl=300
